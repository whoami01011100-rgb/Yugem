<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yugem Advisory - Login</title>

    <!-- Bootstrap 5 CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
        rel="stylesheet">

    <style>
        /* =========================================================
           ROOT & BASE
        ========================================================= */
        :root {
            --navy-900: #0a1f33;
            --navy-800: #102a43;
            --navy-700: #163b5d;
            --gold: #c7a46b;
            --gold-light: #e2c48e;
            --gold-glow: rgba(199, 164, 107, 0.45);
            --ink: #243447;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Plus Jakarta Sans', 'Segoe UI', sans-serif;
            background: var(--navy-900);
            min-height: 100vh;
            overflow-x: hidden;
        }


        /* =========================================================
           ANIMATED BACKGROUND (left panel ke peeche full screen)
        ========================================================= */
        .bg-scene {
            position: fixed;
            inset: 0;
            z-index: 0;
            background:
                radial-gradient(ellipse 80% 60% at 20% 10%, rgba(22, 59, 93, 0.9), transparent 60%),
                radial-gradient(ellipse 60% 50% at 85% 90%, rgba(199, 164, 107, 0.12), transparent 55%),
                linear-gradient(160deg, #0a1f33 0%, #102a43 50%, #081726 100%);
        }

        /* Floating orbs */
        .orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(60px);
            opacity: 0.5;
            animation: floatOrb 12s ease-in-out infinite;
        }

        .orb-1 {
            width: 420px;
            height: 420px;
            background: radial-gradient(circle, rgba(59, 130, 246, 0.35), transparent 70%);
            top: -120px;
            left: -100px;
            animation-delay: 0s;
        }

        .orb-2 {
            width: 360px;
            height: 360px;
            background: radial-gradient(circle, rgba(199, 164, 107, 0.4), transparent 70%);
            bottom: -100px;
            left: 8%;
            animation-delay: 3s;
        }

        .orb-3 {
            width: 300px;
            height: 300px;
            background: radial-gradient(circle, rgba(22, 59, 93, 0.9), transparent 70%);
            top: 30%;
            right: -80px;
            animation-delay: 6s;
        }

        @keyframes floatOrb {

            0%,
            100% {
                transform: translate(0, 0) scale(1);
            }

            33% {
                transform: translate(40px, -30px) scale(1.08);
            }

            66% {
                transform: translate(-25px, 25px) scale(0.95);
            }
        }

        /* Subtle grid pattern overlay */
        .bg-grid {
            position: absolute;
            inset: 0;
            background-image:
                linear-gradient(rgba(255, 255, 255, 0.025) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.025) 1px, transparent 1px);
            background-size: 48px 48px;
            mask-image: radial-gradient(ellipse at 30% 40%, black 30%, transparent 75%);
            -webkit-mask-image: radial-gradient(ellipse at 30% 40%, black 30%, transparent 75%);
        }

        /* Floating particles */
        .particle {
            position: absolute;
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--gold);
            opacity: 0;
            animation: rise 9s linear infinite;
        }

        @keyframes rise {
            0% {
                opacity: 0;
                transform: translateY(100vh) scale(0.5);
            }

            15% {
                opacity: 0.7;
            }

            90% {
                opacity: 0.4;
            }

            100% {
                opacity: 0;
                transform: translateY(-10vh) scale(1);
            }
        }


        /* =========================================================
           MAIN LAYOUT
        ========================================================= */
        .login-page {
            position: relative;
            z-index: 1;
            min-height: 100vh;
            display: flex;
        }


        /* =========================================================
           LEFT BRAND PANEL
        ========================================================= */
        .login-left {
            width: 42%;
            min-height: 100vh;

            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;

            padding: 40px;

            position: relative;

            border-right: 1px solid rgba(255, 255, 255, 0.07);

            animation: slideInLeft 0.9s cubic-bezier(0.22, 1, 0.36, 1) both;
        }

        @keyframes slideInLeft {
            from {
                opacity: 0;
                transform: translateX(-60px);
            }

            to {
                opacity: 1;
                transform: translateX(0);
            }
        }


        /* Decorative rotating ring behind logo */
        .logo-ring {
            position: absolute;
            width: 340px;
            height: 340px;
            border-radius: 50%;
            border: 1px dashed rgba(199, 164, 107, 0.35);
            animation: spinRing 30s linear infinite;
        }

        .logo-ring::before {
            content: "";
            position: absolute;
            top: -5px;
            left: 50%;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: var(--gold);
            box-shadow: 0 0 18px var(--gold-glow);
        }

        @keyframes spinRing {
            to {
                transform: rotate(360deg);
            }
        }


        /* Logo card — glass effect */
        .login-logo-image {
            width: 250px;
            height: 250px;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 20px;

            background: rgba(255, 255, 255, 0.06);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);

            border: 1px solid rgba(255, 255, 255, 0.14);
            border-radius: 28px;

            box-shadow:
                0 25px 60px rgba(0, 0, 0, 0.35),
                0 0 0 1px rgba(255, 255, 255, 0.03),
                inset 0 1px 0 rgba(255, 255, 255, 0.1);

            position: relative;
            z-index: 2;

            transition: transform 0.4s ease, box-shadow 0.4s ease;

            animation: logoFloat 5s ease-in-out infinite;
        }

        .login-logo-image:hover {
            transform: translateY(-6px) scale(1.02);
            box-shadow:
                0 35px 80px rgba(0, 0, 0, 0.45),
                0 0 40px rgba(199, 164, 107, 0.15),
                inset 0 1px 0 rgba(255, 255, 255, 0.12);
        }

        @keyframes logoFloat {

            0%,
            100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-10px);
            }
        }

        .login-logo-image img {
            width: 205px;
            height: 205px;
            max-width: 205px;
            max-height: 205px;
            object-fit: contain;
            display: block;
            filter: drop-shadow(0 8px 20px rgba(0, 0, 0, 0.3));
            user-select: none;
            -webkit-user-select: none;
            -webkit-user-drag: none;
            pointer-events: none;
        }

        /* Brand text */
        .brand-text {
            margin-top: 38px;
            text-align: center;
            position: relative;
            z-index: 2;
        }

        .brand-text h1 {
            color: #ffffff;
            font-size: 26px;
            font-weight: 800;
            letter-spacing: 3px;
            text-transform: uppercase;
            margin-bottom: 8px;
        }

        .brand-text h1 span {
            background: linear-gradient(90deg, var(--gold-light), var(--gold));
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .brand-text p {
            color: rgba(255, 255, 255, 0.55);
            font-size: 13px;
            letter-spacing: 1.5px;
            text-transform: uppercase;
        }

        /* Gold divider line */
        .gold-line {
            width: 60px;
            height: 3px;
            margin: 14px auto 0;
            border-radius: 3px;
            background: linear-gradient(90deg, transparent, var(--gold), transparent);
        }

        /* Old branding hide */
        .login-logo,
        .login-brand h1,
        .login-brand h2,
        .login-brand p {
            display: none !important;
        }


        /* =========================================================
           RIGHT PANEL
        ========================================================= */
        .login-right {
            width: 58%;
            min-height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 40px;

            animation: slideInRight 0.9s cubic-bezier(0.22, 1, 0.36, 1) 0.15s both;
        }

        @keyframes slideInRight {
            from {
                opacity: 0;
                transform: translateX(60px);
            }

            to {
                opacity: 1;
                transform: translateX(0);
            }
        }


        /* =========================================================
           LOGIN CARD — GLASSMORPHISM
        ========================================================= */
        .login-box {
            width: 100%;
            max-width: 460px;

            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);

            padding: 46px 44px;

            border: 1px solid rgba(255, 255, 255, 0.5);
            border-radius: 22px;

            box-shadow:
                0 30px 80px rgba(0, 0, 0, 0.4),
                0 4px 15px rgba(0, 0, 0, 0.15);

            position: relative;
            overflow: hidden;

            transition: transform 0.35s ease, box-shadow 0.35s ease;
        }

        .login-box:hover {
            transform: translateY(-4px);
            box-shadow:
                0 40px 100px rgba(0, 0, 0, 0.5),
                0 6px 20px rgba(0, 0, 0, 0.2);
        }

        /* Top gold accent bar */
        .login-box::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, var(--navy-800), var(--gold), var(--navy-800));
            background-size: 200% 100%;
            animation: shimmer 4s linear infinite;
        }

        @keyframes shimmer {
            to {
                background-position: 200% 0;
            }
        }

        /* Heading */
        .login-box h2 {
            color: var(--navy-800);
            font-size: 30px;
            font-weight: 800;
            letter-spacing: -0.5px;
        }

        .login-box .subtitle {
            margin-top: 8px;
            margin-bottom: 30px;
            color: #7a8aa0;
            font-size: 14px;
        }

        /* Welcome icon badge */
        .welcome-badge {
            width: 58px;
            height: 58px;
            border-radius: 16px;

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 26px;
            color: #ffffff;

            background: linear-gradient(135deg, var(--navy-700), var(--navy-800));

            box-shadow: 0 10px 25px rgba(16, 42, 67, 0.35);

            margin-bottom: 18px;

            position: relative;
            overflow: hidden;
        }

        .welcome-badge::after {
            content: "";
            position: absolute;
            top: -60%;
            left: -60%;
            width: 60%;
            height: 220%;
            background: linear-gradient(105deg, transparent, rgba(255, 255, 255, 0.25), transparent);
            transform: rotate(20deg);
            animation: badgeShine 3.5s ease-in-out infinite;
        }

        @keyframes badgeShine {

            0%,
            60% {
                left: -60%;
            }

            100% {
                left: 160%;
            }
        }


        /* =========================================================
           FORM — FLOATING LABEL STYLE
        ========================================================= */
        .login-form-group {
            margin-bottom: 20px;
        }

        .login-form-group label {
            display: block;
            margin-bottom: 8px;
            color: var(--ink);
            font-size: 13px;
            font-weight: 700;
            letter-spacing: 0.3px;
        }

        .login-input-wrapper {
            position: relative;
            width: 100%;
        }

        .login-input-wrapper input {
            width: 100%;
            height: 52px;

            padding: 0 50px 0 46px;

            background: #ffffff;

            border: 1.5px solid #dde3ea;
            border-radius: 12px;

            color: var(--ink);
            font-size: 14px;
            font-weight: 500;

            transition:
                border-color 0.25s ease,
                box-shadow 0.25s ease,
                transform 0.25s ease;
        }

        .login-input-wrapper input::placeholder {
            color: #a5b0bd;
            font-weight: 400;
        }

        .login-input-wrapper input:hover {
            border-color: #b9c4d1;
        }

        .login-input-wrapper input:focus {
            border-color: var(--gold);
            outline: none;

            box-shadow:
                0 0 0 4px rgba(199, 164, 107, 0.18),
                0 6px 18px rgba(199, 164, 107, 0.12);

            transform: translateY(-1px);
        }

        /* Left input icon */
        .login-input-icon {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);

            color: #8b99ac;
            font-size: 17px;

            pointer-events: none;
            transition: color 0.25s ease;
        }

        .login-input-wrapper input:focus~.login-input-icon {
            color: var(--gold);
        }

        /* Password toggle — Bootstrap icon button */
        .password-toggle {
            position: absolute;
            right: 8px;
            top: 50%;
            transform: translateY(-50%);

            width: 38px;
            height: 38px;

            border: none;
            background: transparent;

            color: #8b99ac;
            font-size: 16px;

            border-radius: 10px;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 0;

            transition: all 0.2s ease;
        }

        .password-toggle:hover {
            background: #f1f4f8;
            color: var(--navy-800);
        }

        .password-toggle:active {
            transform: translateY(-50%) scale(0.9);
        }


        /* =========================================================
           LOGIN BUTTON — GRADIENT + SHINE
        ========================================================= */
        .login-button {
            width: 100%;
            height: 52px;

            margin-top: 6px;

            border: none;
            border-radius: 12px;

            background: linear-gradient(135deg, var(--navy-800) 0%, var(--navy-700) 100%);
            background-size: 150% 150%;

            color: #ffffff;

            font-size: 15px;
            font-weight: 700;
            letter-spacing: 0.5px;

            cursor: pointer;

            position: relative;
            overflow: hidden;

            transition:
                background-position 0.4s ease,
                transform 0.2s ease,
                box-shadow 0.3s ease;
        }

        /* Shine sweep */
        .login-button::after {
            content: "";
            position: absolute;
            top: -60%;
            left: -60%;
            width: 40%;
            height: 220%;
            background: linear-gradient(105deg, transparent, rgba(255, 255, 255, 0.25), transparent);
            transform: rotate(20deg);
            transition: none;
            animation: btnShine 3s ease-in-out infinite;
        }

        @keyframes btnShine {

            0%,
            55% {
                left: -60%;
            }

            100% {
                left: 170%;
            }
        }

        .login-button:hover {
            background-position: 100% 100%;

            transform: translateY(-2px);

            box-shadow:
                0 14px 30px rgba(16, 42, 67, 0.35),
                0 4px 10px rgba(199, 164, 107, 0.25);
        }

        .login-button:active {
            transform: translateY(0) scale(0.98);
        }

        .login-button:focus {
            outline: none;
            box-shadow:
                0 0 0 4px rgba(16, 42, 67, 0.2);
        }

        /* Loading state (JS spinner ke liye) */
        .login-button .btn-spinner {
            display: none;
            width: 20px;
            height: 20px;
            border: 2.5px solid rgba(255, 255, 255, 0.35);
            border-top-color: #ffffff;
            border-radius: 50%;
            animation: spinBtn 0.7s linear infinite;
        }

        .login-button.loading .btn-spinner {
            display: inline-block;
        }

        .login-button.loading .btn-text {
            display: none;
        }

        @keyframes spinBtn {
            to {
                transform: rotate(360deg);
            }
        }


        /* =========================================================
           LOGIN MESSAGE
        ========================================================= */
        #loginMessage {
            margin-bottom: 16px;
        }

        #loginMessage:empty {
            display: none;
        }

        #loginMessage .alert {
            border-radius: 12px;
            font-size: 13px;
            font-weight: 500;
            padding: 12px 14px;
            border: none;
            box-shadow: 0 6px 15px rgba(0, 0, 0, 0.06);
            animation: msgIn 0.35s ease both;
        }

        @keyframes msgIn {
            from {
                opacity: 0;
                transform: translateY(-8px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }


        /* =========================================================
           FOOTER NOTE (card ke andar)
        ========================================================= */
        .card-footer-note {
            margin-top: 24px;
            text-align: center;
            color: #9aa8ba;
            font-size: 12px;
            letter-spacing: 0.4px;
        }

        .card-footer-note i {
            color: var(--gold);
            margin-right: 4px;
        }


        /* =========================================================
           TABLET
        ========================================================= */
        @media (max-width: 992px) {

            .login-left {
                width: 40%;
                padding: 30px;
            }

            .login-right {
                width: 60%;
                padding: 30px;
            }

            .login-box {
                max-width: 430px;
                padding: 38px 34px;
            }

            .login-logo-image {
                width: 215px;
                height: 215px;
            }

            .login-logo-image img {
                width: 175px;
                height: 175px;
                max-width: 175px;
                max-height: 175px;
            }

            .logo-ring {
                width: 290px;
                height: 290px;
            }

            .brand-text h1 {
                font-size: 22px;
            }
        }


        /* =========================================================
           MOBILE
        ========================================================= */
        @media (max-width: 768px) {

            .login-page {
                flex-direction: column;
            }

            .login-left {
                width: 100%;
                min-height: 320px;
                height: 320px;

                border-right: none;
                border-bottom: 1px solid rgba(255, 255, 255, 0.07);

                padding: 25px;
            }

            .login-right {
                width: 100%;
                min-height: calc(100vh - 320px);
                padding: 30px 18px 40px;
                align-items: flex-start;
            }

            .login-logo-image {
                width: 185px;
                height: 185px;
                border-radius: 22px;
                padding: 14px;
            }

            .login-logo-image img {
                width: 155px;
                height: 155px;
                max-width: 155px;
                max-height: 155px;
            }

            .logo-ring {
                width: 250px;
                height: 250px;
            }

            .brand-text {
                margin-top: 22px;
            }

            .brand-text h1 {
                font-size: 19px;
                letter-spacing: 2px;
            }

            .brand-text p {
                font-size: 11px;
            }

            .login-box {
                max-width: 500px;
                padding: 32px 26px;
                border-radius: 18px;
            }

            .login-box h2 {
                font-size: 25px;
            }
        }


        /* =========================================================
           SMALL MOBILE
        ========================================================= */
        @media (max-width: 480px) {

            .login-left {
                min-height: 260px;
                height: 260px;
            }

            .login-right {
                min-height: calc(100vh - 260px);
                padding: 20px 14px 30px;
            }

            .login-logo-image {
                width: 150px;
                height: 150px;
                border-radius: 18px;
            }

            .login-logo-image img {
                width: 125px;
                height: 125px;
                max-width: 125px;
                max-height: 125px;
            }

            .logo-ring {
                width: 200px;
                height: 200px;
            }

            .login-box {
                padding: 26px 20px;
                border-radius: 16px;
            }

            .login-box h2 {
                font-size: 22px;
            }

            .login-box .subtitle {
                font-size: 13px;
                margin-bottom: 24px;
            }

            .login-input-wrapper input {
                height: 50px;
            }

            .login-button {
                height: 50px;
            }
        }
    </style>

    <base target="_blank">
</head>


<body>

    <!-- ANIMATED BACKGROUND -->
    <div class="bg-scene">
        <div class="bg-grid"></div>
        <div class="orb orb-1"></div>
        <div class="orb orb-2"></div>
        <div class="orb orb-3"></div>

        <!-- Floating particles -->
        <span class="particle" style="left: 10%;  animation-delay: 0s;   animation-duration: 9s;"></span>
        <span class="particle" style="left: 25%;  animation-delay: 2s;   animation-duration: 11s;"></span>
        <span class="particle" style="left: 45%;  animation-delay: 4s;   animation-duration: 8s;"></span>
        <span class="particle" style="left: 65%;  animation-delay: 1s;   animation-duration: 10s;"></span>
        <span class="particle" style="left: 80%;  animation-delay: 5s;   animation-duration: 12s;"></span>
        <span class="particle" style="left: 92%;  animation-delay: 3s;   animation-duration: 9.5s;"></span>
    </div>


    <!-- LOGIN PAGE -->
    <div class="login-page">


        <!-- LEFT BRAND PANEL -->
        <section class="login-left">

            <div class="logo-ring"></div>

            <div class="login-logo-image">
                <img src="images/msme-yugem-logo.jpeg" alt="MSME YUGEM" draggable="false">
            </div>

            <div class="brand-text">
                <h1>MSME <span>Yugem</span></h1>
                <div class="gold-line"></div>
                <p class="mt-2">Advisory &amp; Consulting</p>
            </div>

        </section>



        <!-- RIGHT LOGIN AREA -->
        <section class="login-right">

            <div class="login-box">

                <div class="welcome-badge">
                    <i class="bi bi-shield-lock-fill"></i>
                </div>

                <h2>Welcome Back</h2>

                <p class="subtitle">
                    Login to access your dashboard
                </p>


                <!-- LOGIN MESSAGE -->
                <div id="loginMessage"></div>


                <!-- LOGIN FORM -->
                <form id="loginForm" novalidate>


                    <!-- LOGIN ID -->
                    <div class="login-form-group">

                        <label for="loginId">
                            Login ID
                        </label>

                        <div class="login-input-wrapper">

                            <input type="text" id="loginId" name="login_id" placeholder="Enter Login ID"
                                autocomplete="username" required>

                            <span class="login-input-icon">
                                👤
                            </span>

                        </div>

                    </div>



                    <!-- PASSWORD -->
                    <div class="login-form-group">

                        <label for="password">
                            Password
                        </label>

                        <div class="login-input-wrapper">

                            <input type="password" id="password" name="password" placeholder="Enter Password"
                                autocomplete="current-password" required>

                            <span class="login-input-icon">
                                <i class="bi bi-lock-fill"></i>
                            </span>

                            <button type="button" class="password-toggle" id="passwordToggle"
                                aria-label="Toggle password visibility">

                                <i class="bi bi-eye-fill" id="toggleIcon"></i>

                            </button>

                        </div>

                    </div>



                    <!-- LOGIN BUTTON -->
                    <button type="submit" class="login-button" id="loginBtn">

                        <span class="btn-text">
                            Login
                            <i class="bi bi-arrow-right-circle ms-2"></i>
                        </span>

                        <span class="btn-spinner"></span>

                    </button>


                </form>


                <div class="card-footer-note">
                    <i class="bi bi-patch-check-fill"></i>
                    Secure &amp; encrypted login
                </div>

            </div>

        </section>


    </div>



    <!-- Bootstrap JS -->
